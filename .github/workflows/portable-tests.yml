name: Portable Python tests
on:
  workflow_dispatch:
  push:
    paths: ['src/**', 'tests/**', 'examples/**', 'docs/examples/**', 'scripts/**', 'pyproject.toml', 'third_party/**', '.github/workflows/portable-tests.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'examples/**', 'docs/examples/**', 'scripts/**', 'pyproject.toml', 'third_party/**', '.github/workflows/portable-tests.yml']
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m tensormeld validate-config docs/examples/12gb-pc-one-companion.config.json
      - run: python -m tensormeld select docs/examples/four-nodes-multi-gpu.config.json --out local/ci-selection.json
      - run: python -m tensormeld validate examples/synthetic-three-nodes.json
      - run: python -m tensormeld plan examples/synthetic-three-nodes.json --out local/ci-plan.json
      - run: python -m tensormeld plan-v2 docs/examples/12gb-pc-one-companion.config.json examples/v2/12gb-dense.planning.json --out local/ci-v2-plan.json
      - run: python -m compileall -q src tests scripts

  optional-adapter-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install ".[system,gguf]"
      - run: python -c "import gguf, psutil; from importlib.metadata import version; assert version('gguf') == '0.19.0'"
      - run: python -m unittest discover -s tests -p test_open_source_adapters.py -v


  real-mtls-loopback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      PYTHONUTF8: '1'
      TENSORMELD_REAL_MTLS_TEST: '1'
      TENSORMELD_MTLS_CA: local/mtls/ca.pem
      TENSORMELD_MTLS_SERVER_CERT: local/mtls/server.pem
      TENSORMELD_MTLS_SERVER_KEY: local/mtls/server.key
      TENSORMELD_MTLS_CLIENT_CERT: local/mtls/client.pem
      TENSORMELD_MTLS_CLIENT_KEY: local/mtls/client.key
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Generate ephemeral mTLS fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p local/mtls
          openssl req -x509 -newkey rsa:2048 -nodes -days 1             -subj "/CN=TensorMeld Test CA"             -keyout local/mtls/ca.key -out local/mtls/ca.pem
          openssl req -newkey rsa:2048 -nodes             -subj "/CN=localhost"             -keyout local/mtls/server.key -out local/mtls/server.csr
          printf '%s\n'             'subjectAltName=DNS:localhost,IP:127.0.0.1'             'extendedKeyUsage=serverAuth' > local/mtls/server.ext
          openssl x509 -req -days 1             -in local/mtls/server.csr             -CA local/mtls/ca.pem -CAkey local/mtls/ca.key -CAcreateserial             -extfile local/mtls/server.ext             -out local/mtls/server.pem
          openssl req -newkey rsa:2048 -nodes             -subj "/CN=tensormeld-client"             -keyout local/mtls/client.key -out local/mtls/client.csr
          printf '%s\n' 'extendedKeyUsage=clientAuth' > local/mtls/client.ext
          openssl x509 -req -days 1             -in local/mtls/client.csr             -CA local/mtls/ca.pem -CAkey local/mtls/ca.key -CAcreateserial             -extfile local/mtls/client.ext             -out local/mtls/client.pem
          chmod 600 local/mtls/*.key
      - run: python -m unittest tests/test_mtls_integration.py -v
